name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local:
    name: Cucumber UI tests (headless Chrome)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Run @smoke and @regression scenarios
        run: mvn -B --no-transfer-progress clean test -Dheadless=true
      - name: Upload Cucumber report and failure pages
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-report-local
          path: |
            target/cucumber-reports.html
            target/cucumber-reports/
            target/failures/
          if-no-files-found: ignore

  sauce:
    name: Sauce Labs cloud (${{ matrix.browser }} on ${{ matrix.platform }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chrome
            platform: Windows 11
          - browser: MicrosoftEdge
            platform: Windows 11
          - browser: firefox
            platform: macOS 13
    env:
      SAUCE_USERNAME: ${{ secrets.SAUCE_USERNAME }}
      SAUCE_ACCESS_KEY: ${{ secrets.SAUCE_ACCESS_KEY }}
    steps:
      - name: Skip when Sauce Labs secrets are not configured
        if: env.SAUCE_USERNAME == '' || env.SAUCE_ACCESS_KEY == ''
        run: echo "::notice::Add SAUCE_USERNAME and SAUCE_ACCESS_KEY repository secrets to run on Sauce Labs."
      - uses: actions/checkout@v4
        if: env.SAUCE_USERNAME != '' && env.SAUCE_ACCESS_KEY != ''
      - uses: actions/setup-java@v4
        if: env.SAUCE_USERNAME != '' && env.SAUCE_ACCESS_KEY != ''
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Run on Sauce Labs
        if: env.SAUCE_USERNAME != '' && env.SAUCE_ACCESS_KEY != ''
        run: >
          mvn -B --no-transfer-progress clean test -Dsauce=true
          "-Dsauce.browser=${{ matrix.browser }}" "-Dsauce.platform=${{ matrix.platform }}"
          "-Dsauce.build=GitHub Actions #${{ github.run_number }}"
